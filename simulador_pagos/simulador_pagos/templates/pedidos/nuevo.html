{% extends "base.html" %}
{% block contenido %}<h1>Crear pedido</h1>
{% if productos %}
<form method="post">{{ form.hidden_tag() }}
<table><tr><th>Producto</th><th class="num">Precio</th><th class="num">Stock</th><th>Cantidad</th></tr>
{% for p in productos %}<tr><td><label for="qty_{{ p.id }}">{{ p.nombre }}</label></td>
<td class="num">$ {{ '%.2f'|format(p.precio) }}</td><td class="num">{{ p.stock }}</td>
<td><input type="number" id="qty_{{ p.id }}" name="qty_{{ p.id }}" min="0" max="{{ p.stock }}" value="0" style="width:5rem"></td></tr>{% endfor %}</table>
<button class="btn">Crear pedido</button></form>
{% else %}<p>No hay productos con stock. <a href="{{ url_for('productos.nuevo') }}">Agrega uno</a>.</p>{% endif %}{% endblock %}
